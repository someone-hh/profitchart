<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crypto Profit Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b132b;
      color: #fff;
      margin: 0;
      padding: 2rem;
    }
    .container, .result-page {
      max-width: 520px;
      margin: auto;
      background: #1c2541;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }
    h2 {
      text-align: center;
      color: #f5f6fa;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
      color: #a0b0ff;
    }
    select, input, button {
      width: 100%;
      margin-bottom: 1.5rem;
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    select, input {
      background-color: #324a74;
      color: #fff;
    }
    button {
      background-color: #2ecc71;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      background-color: #27ae60;
      transform: translateY(-2px);
    }
    .hidden {
      display: none;
    }
    .result-header {
      text-align: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #3d5a80;
    }
    .result-header h3 {
      color: #f5f6fa;
      margin-bottom: 0.5rem;
      font-size: 1.3rem;
    }
    .result-header p {
      color: #a0b0ff;
      margin: 0;
    }
    .result-card {
      background: #2a3a5a;
      border-radius: 10px;
      padding: 1.2rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .result-card-title {
      font-size: 0.9rem;
      color: #a0b0ff;
      margin-bottom: 0.5rem;
    }
    .result-card-value {
      font-size: 1.2rem;
      font-weight: bold;
    }
    .up {
      color: #2ecc71;
    }
    .down {
      color: #e74c3c;
    }
    .neutral {
      color: #f1c40f;
    }
    .price-update {
      font-size: 0.8rem;
      color: #a0b0ff;
      text-align: right;
      margin-top: -1rem;
      margin-bottom: 1rem;
    }
    .loading {
      color: #a0b0ff;
      font-style: italic;
    }
    .timezone-select {
      margin-top: 1rem;
    }
    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .profit-highlight {
      background: linear-gradient(135deg, #1a3a8f, #102554);
      border-left: 4px solid #2ecc71;
      padding: 1.2rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }
    .profit-highlight .result-card-title {
      color: #fff;
    }
    .profit-highlight .result-card-value {
      font-size: 1.5rem;
    }
    .coin-logo {
      width: 24px;
      height: 24px;
      vertical-align: middle;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="container" id="formContainer">
    <h2>Crypto Profit Calculator</h2>
    
    <label for="timezone">US Time Zone</label>
    <select id="timezone" class="timezone-select">
      <option value="America/New_York">Eastern Time (ET)</option>
      <option value="America/Chicago">Central Time (CT)</option>
      <option value="America/Denver">Mountain Time (MT)</option>
      <option value="America/Los_Angeles">Pacific Time (PT)</option>
      <option value="America/Anchorage">Alaska Time (AKT)</option>
      <option value="Pacific/Honolulu">Hawaii Time (HT)</option>
    </select>
    
    <label for="coin">Select Coin</label>
    <select id="coin">
      <option value="BTC">BTC</option>
      <option value="ETH">ETH</option>
      <option value="TRX">TRX</option>
      <option value="XAU">GOLD</option>
    </select>

    <div class="price-update" id="priceUpdateTime"></div>
    <label for="currentPrice">Current Price (USDT)</label>
    <input type="text" id="currentPrice" readonly value="Loading..." class="loading" />

    <label for="amount">Purchase Amount (USDT)</label>
    <input type="number" id="amount" min="0" step="0.01" placeholder="Enter amount" />

    <label for="direction">Direction</label>
    <select id="direction">
      <option value="up">Up</option>
      <option value="down">Down</option>
    </select>

    <label for="contract">Contract Duration</label>
    <select id="contract">
      <option value="30">30s (12%)</option>
      <option value="60">60s (15%)</option>
      <option value="90">90s (27%)</option>
      <option value="120">120s (35%)</option>
    </select>

    <button onclick="generateProfit()">Generate Profit</button>
  </div>

  <div class="result-page hidden" id="resultPage">
    <div class="result-header">
      <h3 id="rCoinPair"></h3>
      <p id="rDeliveryTime"></p>
    </div>

    <div class="profit-highlight">
      <div class="result-card-title">Your Profit</div>
      <div class="result-card-value neutral" id="rProfit"></div>
    </div>

    <div class="result-grid">
      <div class="result-card">
        <div class="result-card-title">Purchase Amount</div>
        <div class="result-card-value neutral" id="rAmount"></div>
      </div>
      <div class="result-card">
        <div class="result-card-title">Direction</div>
        <div class="result-card-value" id="rDirection"></div>
      </div>
      <div class="result-card">
        <div class="result-card-title">Purchase Price</div>
        <div class="result-card-value neutral" id="rPurchasePrice"></div>
      </div>
      <div class="result-card">
        <div class="result-card-title">Contract</div>
        <div class="result-card-value neutral" id="rContract"></div>
      </div>
      <div class="result-card">
        <div class="result-card-title">Delivery Price</div>
        <div class="result-card-value" id="rDeliveryPrice"></div>
      </div>
    </div>
  </div>

  <script>
    const coinSelect = document.getElementById("coin");
    const currentPriceInput = document.getElementById("currentPrice");
    const priceUpdateTime = document.getElementById("priceUpdateTime");
    const timezoneSelect = document.getElementById("timezone");

    // Coin logos
    const coinLogos = {
         BTC: "images/btc.png",
      ETH: "images/eth.png",
      TRX: "images/trx.png",
      XAU: "images/gold.png"
    };

    // Format time according to selected US timezone
    function formatTime(date, timezone) {
      const options = {
        timeZone: timezone,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      };
      
      return new Intl.DateTimeFormat('en-US', options).format(date);
    }

    async function fetchPrice(symbol) {
      try {
        let pair = 'BTCUSDT';
        if (symbol === 'ETH') pair = 'ETHUSDT';
        else if (symbol === 'TRX') pair = 'TRXUSDT';
        else if (symbol === 'XAU') pair = 'XAUUSDT';

        const response = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${pair}`);
        const data = await response.json();
        return parseFloat(data.price);
      } catch (err) {
        console.error("Error fetching price:", err);
        currentPriceInput.value = "Price unavailable";
        currentPriceInput.classList.add("loading");
        return 0;
      }
    }

    async function updatePrice() {
      const symbol = coinSelect.value;
      currentPriceInput.value = "Loading...";
      currentPriceInput.classList.add("loading");
      
      const price = await fetchPrice(symbol);
      const now = new Date();
      const updateTime = formatTime(now, timezoneSelect.value);
      
      if (price > 0) {
        currentPriceInput.value = price.toFixed(symbol === 'XAU' ? 2 : 4);
        currentPriceInput.classList.remove("loading");
        priceUpdateTime.textContent = `Last updated: ${updateTime}`;
      }
    }

    coinSelect.addEventListener("change", updatePrice);
    timezoneSelect.addEventListener("change", updatePrice);
    window.addEventListener("load", updatePrice);

    function generateProfit() {
      const amount = parseFloat(document.getElementById("amount").value);
      const direction = document.getElementById("direction").value;
      const price = parseFloat(document.getElementById("currentPrice").value);
      const contract = parseInt(document.getElementById("contract").value);
      const symbol = document.getElementById("coin").value;
      const timezone = document.getElementById("timezone").value;

      if (isNaN(amount) || amount <= 0) {
        alert("Please enter a valid amount");
        return;
      }

      let profitRate = 0;
      switch (contract) {
        case 30: profitRate = 0.12; break;
        case 60: profitRate = 0.15; break;
        case 90: profitRate = 0.27; break;
        case 120: profitRate = 0.35; break;
      }

      const profit = amount * profitRate;
      const deliveryPrice = direction === "up" ? price * (1 + profitRate / 10) : price * (1 - profitRate / 10);

      const now = new Date();
      const deliveryTime = new Date(now.getTime() + contract * 1000);
      const formattedTime = formatTime(deliveryTime, timezone);
      const timezoneAbbr = timezoneSelect.options[timezoneSelect.selectedIndex].text.match(/\(([^)]+)\)/)[1];

      document.getElementById("formContainer").classList.add("hidden");
      document.getElementById("resultPage").classList.remove("hidden");

      const formatNumber = (num) => num.toLocaleString(undefined, { 
        minimumFractionDigits: 2, 
        maximumFractionDigits: 2 
      });

      // Set header with logo
      document.getElementById("rCoinPair").innerHTML = `
        <img src="${coinLogos[symbol]}" class="coin-logo">
        ${symbol}/USDT Contract
      `;
      
      document.getElementById("rDeliveryTime").textContent = `Expires: ${formattedTime} ${timezoneAbbr}`;
      
      // Set values with proper styling
      document.getElementById("rAmount").textContent = formatNumber(amount) + " USDT";
      
      const directionElement = document.getElementById("rDirection");
      directionElement.textContent = direction.toUpperCase();
      directionElement.className = direction === 'up' ? 'up' : 'down';
      
      document.getElementById("rPurchasePrice").textContent = formatNumber(price) + " USDT";
      document.getElementById("rContract").textContent = contract + " seconds";
      document.getElementById("rProfit").textContent = "+" + formatNumber(profit) + " USDT";
      
      const deliveryPriceElement = document.getElementById("rDeliveryPrice");
      deliveryPriceElement.textContent = formatNumber(deliveryPrice) + " USDT";
      deliveryPriceElement.className = direction === 'up' ? 'up' : 'down';
    }
  </script>
</body>
</html>
